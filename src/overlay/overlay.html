<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Hydration Buddy</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="bubble" class="bubble hidden" role="dialog" aria-live="polite">
    <button id="close" class="x" title="Dismiss">×</button>
    <div class="hi">Hi! <span class="wave">👋</span></div>
    <div id="msg" class="msg"></div>
    <div class="actions">
      <button id="drank" class="primary">I drank it 💧</button>
      <button id="snooze" class="ghost">Snooze</button>
    </div>
    <div id="count" class="count"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
